<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 PDF Viewer - Button field</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript PDF Viewer Control">
    <meta name="author" content="Syncfusion">
</head>

<body>
    <div class="toolbar-actions">
        <div class="action-group">
            <h4>Add Button Field Programmatically</h4>

            <button onclick="addButtonField()">
                Add Button Field
            </button>

            <button onclick="enableButtonMode()">
                Enable Button Designer Mode
            </button>
        </div>

        <div class="action-group">
            <h4>Edit Button Field</h4>

            <label>
                Field
            </label>

            <select id="buttonFields">
                <option value="">No Button Field</option>
            </select>

            <button onclick="editButtonField()">
                Edit Button Field
            </button>

            <button onclick="deleteSelectedField()">
                Delete Field
            </button>
        </div>
    </div>

    <div id="PdfViewer"></div>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
